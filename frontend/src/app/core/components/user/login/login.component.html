<app-user-base>
  <form #loginForm="ngForm" class="w-50" autocomplete="on" (ngSubmit)="login(loginForm)">
    <div class="form-group mt-2">
      <label class="form-label" for="email" style="font-weight: bold;">Email</label>
      <input class="form-control" type="email" name="email" id="email" #email ngModel>
    </div>
    <div class="form-group mt-2">
      <label class="form-label" for="password" style="font-weight: bold;">Şifre</label>
      <input class="form-control" type="password" name="password" id="password" #password ngModel>
    </div>
    <button class="btn btn-primary mt-4 w-100" type="submit">Giriş Yap</button>
    <div class="text-center mt-4">
      Hesabınız yok mu?
      <a routerLink="/register">Kayıt ol</a>
    </div>
  </form>
</app-user-base>
